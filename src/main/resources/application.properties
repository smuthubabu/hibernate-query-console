# ==========================================
# HQL Query Console - Application Properties
# ==========================================

# Server
server.port=8080
server.address=0.0.0.0

# Application
spring.application.name=HQL Query Console

# Hibernate Configuration
# Path to your existing hibernate.cfg.xml
hibernate.config.path=config/hibernate.cfg.xml
# Optional: directory with additional .hbm.xml files
hibernate.mapping.dir=config/mappings

# Query Settings
query.timeout.seconds=30
query.max.results=1000
query.readonly.mode=false

# Logging
logging.level.com.hqc=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/hibernate-query-console.log

# Disable Spring Boot auto-config we don't need
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
